<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UAC2 共享周期</title>
  <!--STYLE-->
</head>
<body>
  <template id="window-controls">
    <div class="caption-buttons">
      <button data-window="windowMinimize"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg></button>
      <button data-window="windowMaximize"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="maximize-glyph" d="M3 3h10v10H3z"/><path class="restore-glyph" d="M5.5 5.5V2.5h8v8h-3M2.5 5.5h8v8h-8z"/></svg></button>
      <button data-window="exit"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3 3 10 10m0-10L3 13"/></svg></button>
    </div>
  </template>
  <template id="github-mark"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"/></svg></template>
  <div class="facets" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <header class="brand titlebar">
    <div class="brand-identity"><img src="__ICON__" width="46" height="46" alt=""><h1 data-t="app"></h1></div>
    <div class="brand-options">
      <div class="pills lang" role="group" aria-label="中文 / English">
        <button id="zh" lang="zh-CN">中文</button><button id="en" lang="en">en</button>
      </div>
      <button id="about" data-t="about" aria-haspopup="dialog"></button>
    </div>
    <div class="drag-region"></div>
    <button id="diagnostics" data-t="diagnostics" aria-haspopup="dialog" disabled></button>
  </header>
  <div class="shell">
    <main id="workspace" hidden>
      <p id="storage-status" role="status" hidden></p>
      <section class="card device-card" aria-labelledby="output-label">
        <div class="device-field">
          <div class="device-glyph" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 21v-5a11 11 0 0 1 22 0v5"/><rect x="3" y="16" width="6" height="11" rx="3"/><rect x="23" y="16" width="6" height="11" rx="3"/></svg></div>
          <div class="select-field"><label for="output" id="output-label" data-t="output"></label><div class="select-wrap"><select id="output"></select></div></div>
        </div>
        <div class="device-detail support"><span class="caption" data-t="driver"></span><strong id="binding"></strong></div>
        <div class="device-detail"><span class="caption" data-t="format"></span><strong id="format"></strong></div>
        <div class="device-detail"><span class="caption" data-t="mix"></span><strong id="mix"></strong></div>
        <div class="device-note" id="device-note" hidden></div>
      </section>
      <div id="notice" role="status" hidden></div>
      <div class="columns">
        <section class="card panel controls">
          <h2 data-t="target"></h2>
          <div class="target-line">
            <div class="meter"><output for="slider" id="ms"></output><span class="unit">ms</span></div>
            <div class="frames"><span id="frames"></span><small id="rounded"></small></div>
          </div>
          <input type="range" id="slider" min="0.5" max="10" step="0.1" value="3">
          <p class="hint" id="slider-help"></p>
          <p id="low" class="risk" data-t="low" hidden></p>
          <div class="pills scope" role="group" id="scope">
            <button id="one" data-t="one"></button><button id="all" data-t="all"></button>
          </div>
          <button class="primary apply" id="apply" data-t="apply"></button>
          <section class="readings" aria-labelledby="read-title">
            <div class="section-heading"><h3 id="read-title" data-t="windows"></h3>
              <button class="icon refresh" id="refresh"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 8a8.3 8.3 0 1 0 .1 7M20 3.5V8h-4.5"/></svg></button>
              <time id="stamp"></time>
            </div>
            <dl class="row-list" id="read-list"></dl>
          </section>
        </section>
        <section class="card panel results">
          <div class="section-heading"><h2 data-t="queue"></h2><button class="secondary" id="bench" data-t="test"></button></div>
          <div class="result-body">
            <p class="caption result-context" id="test-context"></p>
            <div class="queue-label" data-t="currentSetting"></div>
            <div class="meter queue-meter"><span id="queue-ms"></span><span id="queue-unit" class="unit">ms</span></div>
            <p class="hint queue-hint" data-t="queueHelp"></p>
            <div class="comparisons" id="comparisons"></div>
            <details id="test-details"><summary data-t="details"></summary><div id="test-data"></div></details>
          </div>
          <div id="test-state" class="result-status" role="status"></div>
        </section>
      </div>
      <footer class="card footer">
        <div class="restore-block"><h2 data-t="recovery"></h2><div class="restore-actions">
          <button class="secondary" id="restore" data-t="restore"></button>
          <button class="secondary" id="hard-restart" data-t="hardRestart"></button>
          <button class="danger" id="force" data-t="force"></button>
        </div><small id="restore-help"></small></div>
        <div class="theme" role="group" id="theme"><button id="dark" class="swatch dark"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19.5 14.8A8.9 8.9 0 0 1 9.2 4.5a8.2 8.2 0 1 0 10.3 10.3Z" fill="currentColor" stroke="none"/></svg></button>
          <button id="light" class="swatch light"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.8"/><path d="M12 2v2.2m0 15.6V22M2 12h2.2m15.6 0H22M5 5l1.6 1.6m10.8 10.8L19 19M5 19l1.6-1.6M17.4 6.6L19 5"/></svg></button></div>
      </footer>
    </main>
  </div>
  <dialog id="modal" aria-labelledby="dialog-title"><div class="titlebar"><div class="drag-region"></div></div><div id="dialog-content"></div></dialog>
  <!--SCRIPT-->
</body>
</html>
